slam_toolbox:
  ros__parameters:
    # --- solver ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # --- frames / topics (matches your existing AMCL config) ---
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: sensors/lidar2d_0/scan
    mode: localization

    # --- map to load on startup ---
    # Point this at the .posegraph/.data pair from the serialize_map step,
    # WITHOUT the extension.
    map_file_name: /home/rbt-roeun/clearpath/office_map
    # Seeds the search near your known sim spawn pose (same values as your
    # AMCL initial_pose_x/y/yaw). Unlike AMCL's set_initial_pose, this is a
    # starting hint for scan matching, not a hard lock.
    map_start_pose: [0.68, 0.73, 1.5707963267948966]
    # --- scan handling ---
    max_laser_range: 20.0   # matches your Hokuyo UST cap from the AMCL config
    min_laser_range: 0.0
    resolution: 0.05
    throttle_scans: 1
    scan_buffer_size: 10        # circular buffer size used in localization mode
    scan_buffer_maximum_scan_distance: 20.0

    # --- update thresholds (~ AMCL's update_min_a / update_min_d) ---
    minimum_travel_distance: 0.15
    minimum_travel_heading: 0.12
    minimum_time_interval: 0.5

    # --- transform timing ---
    transform_publish_period: 0.02   # 0 = never publish odom->map, keep nonzero
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    # --- misc ---
    debug_logging: false
    use_scan_matching: true
    use_scan_barycenter: true
    enable_interactive_mode: false
    stack_size_to_use: 40000000   # needed for deserializing larger pose-graphs